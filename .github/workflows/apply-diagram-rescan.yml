name: apply-diagram-rescan

on:
  push:
    branches: [docs/diagram-rescan-fix]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/diagram-rescan-fix
      - name: Correct required qualification topology in Mermaid architecture
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('    CONTRACT --> GATE[CI / ci-gate]\n', '    CONTRACT --> GATE[CI / ci-gate]\n    CHANGE --> NODE22[Node 22 compatibility contracts]\n    NODE22 --> GATE\n'),
              ('    EVIDENCE --> DEVICEOUT[Device-run evidence]\n', '    EVIDENCE --> DEVICEOUT[Device-run evidence]\n\n    CHANGE --> DOCS[README + runtime/workflow contracts]\n    DOCS --> DG[Docs / docs-contract]\n'),
              ('    REVIEW[Dependency Review when available] --> SG\n', '    REVIEW[Dependency Review when available] --> SG\n\n    GATE --> RESULT[Qualified framework change]\n    DG --> RESULT\n    SG --> RESULT\n'),
              ('    class CFG,CAP,PLATFORM,UIA,XCU policy;\n', '    class CFG,CAP,PLATFORM,UIA,XCU,DOCS policy;\n'),
              ('    class SESSION,WDIO,APPIUM,DEVICE,SCREEN runtime;\n', '    class SESSION,WDIO,APPIUM,DEVICE,SCREEN,CONTRACT,NODE22 runtime;\n'),
              ('    class EVIDENCE,DEVICEOUT evidence;\n', '    class EVIDENCE,DEVICEOUT,RESULT evidence;\n'),
              ('    class CONTRACT,GATE,SAST,AUDIT,TRIVY,REVIEW,SG gate;\n', '    class GATE,DG,SAST,AUDIT,TRIVY,REVIEW,SG gate;\n'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one mobile diagram fragment: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit README correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --check
          git commit -m 'docs: align mobile Mermaid diagram with qualification gates'
          git push origin HEAD:docs/diagram-rescan-fix
