name: audit-lock-sync

on:
  push:
    branches:
      - audit/qualify-node-support-policy

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/qualify-node-support-policy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Pin npm runtime
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.19.1
      - name: Synchronize generated lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: synchronize Appium lockfile runtime metadata'
          git push origin HEAD:audit/qualify-node-support-policy
