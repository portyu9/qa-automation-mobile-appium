name: dependency-refresh

on:
  push:
    branches: [build/production-appium-framework]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: build/production-appium-framework
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Resolve remediated graph
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts "npm@11.19.1"
          [[ "$(npm --version)" == "11.19.1" ]]
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove framework compatibility
        run: npm run quality
      - name: Prove HIGH/CRITICAL advisory gate
        run: npm audit --audit-level=high
      - name: Commit qualified lock and remove refresh workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dependency-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json .github/workflows/dependency-refresh.yml
          git commit -m 'security: lock remediated WebdriverIO dependency graph'
          git push origin HEAD:build/production-appium-framework
