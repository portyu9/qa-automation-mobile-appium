name: normalize-versionless-docs
on:
  push:
    branches: [chore/versionless-docs]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Normalize Appium documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('README.md'),*sorted(Path('docs').rglob('*.md'))]
          techs=['Node.js','Node','npm','Appium','WebdriverIO','TypeScript','UiAutomator2','XCUITest','Android','iOS','W3C WebDriver','Trivy','CodeQL']
          exact={'Node 24.20.0 / npm 11.19.1':'repository-pinned Node/npm toolchain','Node 24.20.0':'primary Node runtime','Node 24':'primary Node runtime','Node 22':'additional Node runtime','npm@11.19.1':'npm','npm 11.19.1':'npm','Appium 3':'Appium','WebdriverIO 9':'WebdriverIO'}
          badge_rules=[
            (r'/badge/Appium-[0-9][^-?)]*-(662D91(?:\?[^)]*)?)',r'/badge/Appium-automation-\1'),
            (r'/badge/WebdriverIO-[0-9][^-?)]*-(EA5906(?:\?[^)]*)?)',r'/badge/WebdriverIO-client-\1'),
            (r'/badge/TypeScript-[0-9][^-?)]*-(3178C6(?:\?[^)]*)?)',r'/badge/TypeScript-language-\1'),
            (r'/badge/Node\.js-[0-9][^-?)]*-(339933(?:\?[^)]*)?)',r'/badge/Node.js-runtime-\1'),
          ]
          for path in files:
            text=path.read_text(encoding='utf-8')
            for a,b in exact.items(): text=text.replace(a,b)
            for pat,repl in badge_rules: text=re.sub(pat,repl,text)
            for tech in techs:
              text=re.sub(rf'(?i)\b{re.escape(tech)}\s+(?:\*\*|`)?v?\d+(?:\.\d+)*(?:\.x)?(?:\s+LTS)?(?:\*\*|`)?',tech,text)
            text=re.sub(r'(?i)\bnpm@\d+(?:\.\d+)*','npm',text)
            path.write_text(text,encoding='utf-8')

          validator=Path('scripts/validate-docs.mjs')
          text=validator.read_text(encoding='utf-8')
          for old,new in {
            "  'Appium 3',":"  'Appium',",
            "  'WebdriverIO 9',":"  'WebdriverIO',",
            "  'Node 24.20.0',":"  'Node',",
            "  'npm 11.19.1',":"  'npm',",
          }.items(): text=text.replace(old,new)
          validator.write_text(text,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=r'(?:Node\.js|Node|npm|Appium|WebdriverIO|TypeScript|UiAutomator2|XCUITest|Android|iOS|W3C WebDriver|Trivy|CodeQL)'
          pats=[re.compile(rf'(?i)\b{names}\s+(?:\*\*|`)?v?\d+(?:\.\d+)*(?:\.x)?'),re.compile(r'(?i)\bnpm@\d'),re.compile(r'(?i)/badge/(?:Appium|WebdriverIO|TypeScript|Node\.js)-\d')]
          bad=[]
          for p in [Path('README.md'),*sorted(Path('docs').rglob('*.md'))]:
            for n,l in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if any(x.search(l) for x in pats): bad.append(f'{p}:{n}: {l}')
          if bad: print('\n'.join(bad)); raise SystemExit(1)
          PY
          node scripts/validate-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/doc-version-normalize.yml
          git add -A
          git diff --cached --check
          git commit -m "docs: make technology documentation versionless"
          git push origin HEAD
