name: readme-knowledge-audit-fix

on:
  push:
    branches: [docs/readme-knowledge-audit]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/readme-knowledge-audit
      - name: Refine README title and documentation contract
        shell: python
        run: |
          from pathlib import Path
          replacements = [
              ('README.md', '# Mobile Automation with Appium', '# Mobile / Appium Quality Engineering Framework'),
              ('scripts/validate-docs.mjs', "'# Mobile Automation with Appium'", "'# Mobile / Appium Quality Engineering Framework'"),
          ]
          for path, old, new in replacements:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one title contract, found {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit branch-only documentation correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/readme-knowledge-audit-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md scripts/validate-docs.mjs .github/workflows/readme-knowledge-audit-fix.yml
          git commit -m 'docs: align Appium framework title and contract'
          git push origin HEAD:docs/readme-knowledge-audit