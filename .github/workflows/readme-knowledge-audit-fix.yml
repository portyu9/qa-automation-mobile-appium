name: readme-knowledge-audit-fix

on:
  push:
    branches: [docs/readme-knowledge-audit]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/readme-knowledge-audit
      - name: Replace status-less manual workflow badge
        shell: python
        run: |
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '[![Device Smoke](https://github.com/portyu9/qa-automation-mobile-appium/actions/workflows/device-smoke.yml/badge.svg)](https://github.com/portyu9/qa-automation-mobile-appium/actions/workflows/device-smoke.yml)'
          new = '[![Device Smoke](https://img.shields.io/badge/Device%20Smoke-manual-8250DF?logo=githubactions&logoColor=white)](https://github.com/portyu9/qa-automation-mobile-appium/actions/workflows/device-smoke.yml)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Device Smoke workflow-status badge, found {text.count(old)}')
          readme.write_text(text.replace(old, new), encoding='utf-8')

          validator = Path('scripts/validate-docs.mjs')
          vtext = validator.read_text(encoding='utf-8')
          old_loop = "for (const workflow of ['ci.yml', 'security.yml', 'docs.yml', 'device-smoke.yml']) {"
          new_loop = "for (const workflow of ['ci.yml', 'security.yml', 'docs.yml']) {"
          if vtext.count(old_loop) != 1:
              raise SystemExit('workflow badge validator loop did not match exactly once')
          vtext = vtext.replace(old_loop, new_loop)
          marker = "const mermaid = readme.match(/```mermaid\\s*\\n([\\s\\S]*?)```/u)?.[1];"
          insertion = "if (!readme.includes('https://img.shields.io/badge/Device%20Smoke-manual-8250DF') || !readme.includes('actions/workflows/device-smoke.yml')) {\n  throw new Error('README must identify device-smoke as a manual workflow without implying continuous status');\n}\n\n" + marker
          if vtext.count(marker) != 1:
              raise SystemExit('manual badge validator insertion marker did not match exactly once')
          validator.write_text(vtext.replace(marker, insertion), encoding='utf-8')
      - name: Commit branch-only documentation correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/readme-knowledge-audit-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md scripts/validate-docs.mjs .github/workflows/readme-knowledge-audit-fix.yml
          git commit -m 'docs: label device smoke as manual'
          git push origin HEAD:docs/readme-knowledge-audit