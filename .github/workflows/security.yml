name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NPM_VERSION: 11.19.1

jobs:
  supply-chain-policy:
    name: Supply-chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate immutable Actions and repository-owned evidence policy
        run: |
          node scripts/validate-workflow-pins.mjs
          node --check scripts/validate-security-evidence.mjs
          python3 -m py_compile .github/scripts/validate_codeql_sarif.py .github/scripts/validate_codeql_sarif_selfcheck.py .github/scripts/validate_security_stack.py
          python3 .github/scripts/validate_codeql_sarif_selfcheck.py
          python3 .github/scripts/validate_security_stack.py

  codeql:
    name: CodeQL
    needs: supply-chain-policy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate zero-alert security implementation
        run: |
          python3 -m py_compile .github/scripts/validate_codeql_sarif.py .github/scripts/validate_codeql_sarif_selfcheck.py .github/scripts/validate_security_stack.py
          python3 .github/scripts/validate_codeql_sarif_selfcheck.py
          python3 .github/scripts/validate_security_stack.py
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript,python,actions
          queries: security-extended
      - name: Analyze
        id: analyze-source
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: reports/security/codeql-source
      - name: Enforce zero CodeQL alerts
        env:
          SARIF_DIR: ${{ steps.analyze-source.outputs.sarif-output }}
        run: python3 .github/scripts/validate_codeql_sarif.py "$SARIF_DIR"
      - name: Upload CodeQL SARIF evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: reports/security/codeql-source/
          if-no-files-found: error
          retention-days: 14

  npm-audit:
    name: npm audit
    needs: supply-chain-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global --ignore-scripts "npm@${NPM_VERSION}"
      - name: Audit committed graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/security/npm
          set +e
          npm audit --audit-level=high --json > reports/security/npm/audit.json
          status=$?
          set -e
          node scripts/validate-security-evidence.mjs npm-audit reports/security/npm/audit.json
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appium-npm-audit
          path: reports/security/npm/
          if-no-files-found: error
          retention-days: 14

  trivy:
    name: Trivy
    needs: supply-chain-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p reports/security/trivy
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          list-all-pkgs: true
          format: json
          output: reports/security/trivy/trivy.json
          exit-code: "1"
      - name: Require attributed scanner evidence
        if: always()
        run: node scripts/validate-security-evidence.mjs trivy reports/security/trivy/trivy.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appium-trivy
          path: reports/security/trivy/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: dependency-review
    needs: supply-chain-policy
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe the actual pull-request Dependency Review comparison API
        id: graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Missing immutable PR base/head SHAs for Dependency Review.'
            exit 1
          }
          response="$RUNNER_TEMP/dependency-review-comparison.json"
          if ! status="$(curl --silent --show-error --max-time 20 --retry 2 \
            --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA")"; then
            echo '::error::Dependency Review comparison API transport failed; refusing degraded success.'
            exit 1
          fi
          if [[ "$status" == 200 ]]; then
            jq -e 'type == "array"' "$response" >/dev/null || {
              echo '::error::Dependency Review comparison API returned malformed data.'
              exit 1
            }
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Authenticated PR dependency comparison succeeded; run change-aware Dependency Review.'
          elif [[ "$status" == 403 || "$status" == 404 ]]; then
            message="$(jq -r 'if type == "object" then (.message // "unspecified") else "non-JSON API error" end' "$response" 2>/dev/null | tr '\n' ' ' | cut -c 1-200 || true)"
            if [[ "${message,,}" == *"rate limit"* || "${message,,}" == *"abuse detection"* ]]; then
              echo "::error::Dependency Review API rate-limited the request (HTTP $status); refusing false degraded status."
              exit 1
            fi
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub PR dependency comparison returned HTTP $status: $message. Change-aware Dependency Review is NOT operational. Independent repository vulnerability scans remain required but are not equivalent."
            {
              echo '### Dependency Review: confirmed degraded coverage'
              echo
              echo "- Exact PR dependency comparison: HTTP $status ($message)."
              echo '- GitHub Dependency Review action was not run. The required independent npm/Python/Maven/NuGet/image/Trivy gates remain unchanged, not equivalent to PR change review.'
              echo '- Enable/configure Dependency Graph and proper GitHub Actions token access in repository security settings to restore this control.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Unexpected Dependency Review API HTTP $status; refusing degraded success."
            exit 1
          fi
      - if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - if: steps.graph.outputs.available != 'true'
        run: echo 'Change-aware Dependency Review unavailable; fallback is explicit and not represented as equivalent.'

  security-gate:
    name: security-gate
    if: always()
    needs: [supply-chain-policy, codeql, npm-audit, trivy, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate security jobs
        env:
          SUPPLY: ${{ needs.supply-chain-policy.result }}
          CODEQL: ${{ needs.codeql.result }}
          AUDIT: ${{ needs.npm-audit.result }}
          TRIVY: ${{ needs.trivy.result }}
          REVIEW: ${{ needs.dependency-review.result }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          [[ "$SUPPLY" == success ]] || exit 1
          [[ "$AUDIT" == success ]] || exit 1
          [[ "$TRIVY" == success ]] || exit 1
          if [[ "$SAME_REPO" == true ]]; then [[ "$CODEQL" == success ]] || exit 1; else [[ "$CODEQL" == skipped ]] || exit 1; fi
          if [[ "$EVENT" == pull_request ]]; then [[ "$REVIEW" == success ]] || exit 1; else [[ "$REVIEW" == skipped ]] || exit 1; fi
